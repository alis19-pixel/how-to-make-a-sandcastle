<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>How to Make a Sandcastle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: beach "video" stage on the left (sticky on phones), lesson panel on the right, word chips under the stage */
:root{
  --ink:#13264A; --ink2:#3C5378; --coral:#FF5B6E; --coralD:#E23A55; --sun:#FFC42E;
  --sea:#0FB5E8; --mint:#14C79A; --mintBg:#E3FFF4; --red:#FF3355; --redBg:#FFEFF2;
  --card:#FFFFFF; --line:#DCEBF6; --bg:#5CD3FF;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
html{min-height:100%}
body{
  min-height:100%;
  background:var(--bg) linear-gradient(180deg,#22BDFF 0%,#79DBFF 40%,#FFE7A0 100%);
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45;
  padding-block:16px 40px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#22BDFF}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* header */
.top{max-width:1280px;margin:0 auto 16px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.kicker{margin:0 0 6px;font-weight:900;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(30px,4.6vw,52px);line-height:.95;color:#fff;letter-spacing:.01em;text-shadow:0 3px 0 var(--ink),0 6px 18px rgba(19,38,74,.25);text-wrap:balance}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.steps{list-style:none;margin:0;display:flex;gap:6px;background:rgba(255,255,255,.4);padding:6px;border-radius:999px}
.steps li{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;background:#fff;color:var(--ink2);transition:transform .25s,background .25s}
.steps li.now{background:var(--coral);color:#fff;transform:scale(1.1)}
.steps li.done{background:var(--mint);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;background:#fff;border:0;font-weight:900;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.tog{cursor:pointer;box-shadow:0 3px 0 rgba(19,38,74,.18)}
.tog[aria-pressed="true"]{background:var(--ink);color:#fff}

/* grid */
.game{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"stage panel" "words panel";gap:18px;align-items:start}
.stage{grid-area:stage;position:relative;aspect-ratio:5/3;max-width:100%;border-radius:28px;overflow:hidden;border:4px solid #fff;background:#8BE6FF;box-shadow:0 22px 44px -22px rgba(19,38,74,.6)}
.stage svg{display:block;width:100%;height:100%}
.caption{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:calc(100% - 24px);width:max-content;background:rgba(19,38,74,.88);color:#fff;font-weight:800;font-size:clamp(13px,1.55vw,18px);line-height:1.3;padding:8px 16px;border-radius:999px;text-align:center;box-shadow:0 6px 16px rgba(19,38,74,.25)}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.stamp span{width:min(24%,132px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--mint);box-shadow:0 0 0 8px rgba(255,255,255,.75),0 14px 30px rgba(19,38,74,.3)}
.stamp.bad span{background:var(--red)}
.stamp svg{width:55%;height:55%}
#confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#confetti i{position:absolute;top:0;width:9px;height:14px;border-radius:2px}

/* panel */
.panel{grid-area:panel;background:var(--card);border-radius:28px;padding:clamp(18px,2.4vw,28px);display:flex;flex-direction:column;gap:16px;box-shadow:0 22px 44px -24px rgba(19,38,74,.55)}
.eyebrow{font-weight:900;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral)}
h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(30px,3.4vw,42px);line-height:1;color:var(--ink);text-wrap:balance}
.sub{margin:6px 0 0;color:var(--ink2);font-weight:700}
.q{display:flex;align-items:center;gap:12px;font-size:clamp(17px,1.6vw,20px);font-weight:800}
.q p{margin:0}
.say{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:#E3F6FF;color:#0A86C8;display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .15s}
.say:hover{background:#C9EEFF;transform:scale(1.06)}
.say svg{width:22px;height:22px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:12px;width:100%;min-height:78px;padding:10px 14px 10px 10px;text-align:left;cursor:pointer;background:#fff;border:3px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line);transition:transform .15s,border-color .15s,box-shadow .15s,opacity .2s,filter .2s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--sea);box-shadow:0 6px 0 #9FDDF5}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt:disabled{cursor:default}
.letter{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--ink);color:#fff;font-family:var(--display);font-size:20px}
.opt .ico svg{width:56px;height:56px;display:block}
.otext{min-width:0}
.otext b{display:block;font-size:17px;font-weight:800;line-height:1.25}
.opt.playing{border-color:var(--sun);box-shadow:0 0 0 5px rgba(255,196,46,.4)}
.opt.wrong{border-color:var(--red);box-shadow:0 0 0 4px rgba(255,51,85,.2);background:var(--redBg);opacity:.62;filter:grayscale(.35)}
.opt.wrong .letter{background:var(--red)}
.opt.right{border-color:var(--mint);background:var(--mintBg);box-shadow:0 0 0 5px rgba(20,199,154,.25)}
.opt.right .letter{background:var(--mint)}
.opt.wrong:not(:disabled):hover{opacity:.9;filter:none}
.next:disabled{opacity:.5;cursor:default}
.fb{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:18px;font-weight:800;font-size:17px;line-height:1.35}
.fb p{margin:0}
.fb.bad{background:var(--redBg);color:#8F0F2A}
.fb.good{background:var(--mintBg);color:#0B6B52}
.fb .mark{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}
.fb .mark svg{width:20px;height:20px}
.fb.bad .mark{background:var(--red)}
.fb.good .mark{background:var(--mint)}
.fb .grow{flex:1;min-width:0}
.fb .say{width:36px;height:36px;background:#fff}
.next{border:0;border-radius:999px;background:var(--coral);color:#fff;font-family:var(--display);font-size:22px;letter-spacing:.02em;padding:16px 24px;cursor:pointer;box-shadow:0 6px 0 var(--coralD);transition:transform .15s,box-shadow .15s}
.next:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--coralD)}
.next:active{transform:translateY(3px);box-shadow:0 2px 0 var(--coralD)}
.hint{margin:0;font-size:14px;color:var(--ink2);font-weight:700}
.score{margin:0;font-size:18px;font-weight:800}
.recap ol{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:r}
.recap li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:#F3FAFF;font-weight:800;counter-increment:r}
.recap li::before{content:counter(r);flex:none;width:28px;height:28px;border-radius:9px;background:var(--mint);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:400}
.recap li .t{flex:1;min-width:0}
.recap .say{width:34px;height:34px}

/* words */
.words{grid-area:words;background:rgba(255,255,255,.78);border-radius:24px;padding:14px 16px 16px}
.label{font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px 6px 8px;border:0;border-radius:14px;background:#fff;cursor:pointer;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--line);transition:transform .15s}
.chip:hover{transform:translateY(-2px)}
.chip .dotspk{width:30px;height:30px;border-radius:50%;background:#FFF0B8;color:#B07800;display:grid;place-items:center}
.chip .dotspk svg{width:16px;height:16px}

/* svg scene bits */
.pin circle{fill:#fff;stroke:var(--ink);stroke-width:3;transition:fill .3s}
.pin text{fill:var(--ink);font-family:var(--display);font-size:22px}
.pin .tip{fill:var(--ink)}
.pin.play circle{fill:var(--sun)}
.pin.bad circle{fill:var(--red)} .pin.bad text{fill:#fff}
.pin.good circle{fill:var(--mint)} .pin.good text{fill:#fff}
.pin-head{transform-box:fill-box;transform-origin:50% 100%;animation:bob 1.8s ease-in-out infinite}
.sealines{animation:sway 3.6s ease-in-out infinite alternate}
.cloud{animation:float 16s ease-in-out infinite alternate}
.cloud.c2{animation-duration:22s}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.foam{stroke-dasharray:16 10;animation:foam 2.6s linear infinite}
.flag-cloth{transform-box:fill-box;transform-origin:0 50%;animation:flap 1.1s ease-in-out infinite alternate}
.gull{animation:glide 7s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-7px)}}
@keyframes sway{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
@keyframes float{to{transform:translateX(46px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes foam{to{stroke-dashoffset:-52}}
@keyframes flap{from{transform:skewY(-7deg) scaleX(.92)}to{transform:skewY(6deg) scaleX(1)}}
@keyframes glide{to{transform:translate(30px,-8px)}}

/* narrow portrait: stage on top and sticky so the "video" is always visible */
@media (max-width:880px) and (orientation:portrait){
  .game{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "panel" "words";gap:14px}
  .stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-radius:22px;border-width:3px}
  .top{align-items:flex-start}
}
@media (max-width:520px){
  .hud{width:100%;justify-content:space-between}
  .steps li{width:28px;height:28px;font-size:13px}
  .pill{height:40px;padding:0 12px;font-size:14px}
  .opt{min-height:70px;gap:10px;padding:8px 10px 8px 8px}
  .opt .ico svg{width:48px;height:48px}
  .letter{width:32px;height:32px;font-size:18px}
  .otext b{font-size:16px}
}
/* small landscape phones keep two columns */
@media (max-height:520px) and (orientation:landscape){
  .game{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .pin-head,.sealines,.cloud,.rays,.foam,.flag-cloth,.gull{animation:none}
}
</style>

      </g>

      <g transform="translate(772,332)">

        <g class="pin" id="pinC"><ellipse cx="690" cy="428" rx="14" ry="4.5" fill="#13264A" opacity=".2"/><g class="pin-head" style="animation-delay:.6s"><path class="tip" d="M681,402 L690,421 L699,402 Z"/><circle cx="690" cy="386" r="20"/><text x="690" y="394" text-anchor="middle">C</text></g></g>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';

function add(parent,str,before){

}
function A(el,frames,dur,o){
  o=o||{}; if(!el||!el.animate) return Promise.resolve();
  const a=el.animate(frames,{duration:dur,easing:o.ease||'ease-in-out',fill:'forwards',delay:o.delay||0,iterations:o.it||1});
  return a.finished.catch(()=>{});
}

function camera(to,dur){
  if(RM||!dur){ cam=to.slice(); svg.setAttribute('viewBox',cam.join(' ')); return Promise.resolve(); }
  const from=cam.slice(), t0=performance.now();
  return new Promise(res=>{ function f(t){ const k=Math.min(1,(t-t0)/dur); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; cam=from.map((v,i)=>v+(to[i]-v)*e); svg.setAttribute('viewBox',cam.map(v=>v.toFixed(2)).join(' ')); k<1?requestAnimationFrame(f):res(); } requestAnimationFrame(f); });
}

function towerSVG(x,b,wb,wt,h,fill,cls,win){

  const body='M'+l0+','+b+' L'+l1+','+t+' L'+r1+','+t+' L'+r0+','+b+' Z';
  const tw=wt/7, th=Math.max(6,h*.13); let teeth='';
  for(let i=0;i<4;i++){ teeth+='<rect x="'+(l1+i*2*tw).toFixed(1)+'" y="'+(t-th).toFixed(1)+'" width="'+tw.toFixed(1)+'" height="'+(th+1).toFixed(1)+'" fill="'+fill+'" stroke="#B9783A" stroke-width="2" stroke-linejoin="round"/>'; }
  let rid=''; [.33,.66].forEach(k=>{ const y=b-h*k, a=L(l0,l1,k)+3, c=L(r0,r1,k)-3; rid+='<path d="M'+a+','+y+' L'+c+','+y+'" stroke="#fff" stroke-opacity=".4" stroke-width="2.5"/><path d="M'+a+','+(y+3)+' L'+c+','+(y+3)+'" stroke="#8A4B12" stroke-opacity=".22" stroke-width="2"/>'; });
  const shade='<path d="M'+(x+wb*.12)+','+b+' L'+(x+wt*.12)+','+t+' L'+r1+','+t+' L'+r0+','+b+' Z" fill="#8A4B12" opacity=".13"/>';
  const w=(win&&h>40)?(()=>{const y=b-h*.5;return '<path d="M'+(x-6)+','+(y+9)+' L'+(x-6)+','+y+' Q'+x+','+(y-10)+' '+(x+6)+','+y+' L'+(x+6)+','+(y+9)+' Z" fill="#7A4517" opacity=".72"/>';})():'';
  return '<g class="'+(cls||'')+'">'+teeth+'<path d="'+body+'" fill="'+fill+'" stroke="#B9783A" stroke-width="2.4" stroke-linejoin="round"/><path d="'+body+'" fill="url(#grain)"/>'+shade+rid+w+'</g>';
}
function wallSVG(x0,x1,h){ const tw=(x1-x0)/5; let s='<rect x="'+x0+'" y="'+(-h)+'" width="'+(x1-x0)+'" height="'+h+'" fill="url(#sandG)" stroke="#B9783A" stroke-width="2.2"/>'; for(let i=0;i<3;i++) s+='<rect x="'+(x0+i*2*tw)+'" y="'+(-h-7)+'" width="'+tw+'" height="8" fill="url(#sandG)" stroke="#B9783A" stroke-width="2"/>'; return s; }

function crumble(x0,x1,y0,y1,g,color,n){

    const c=add(grp,'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+color+'" stroke="#B9783A" stroke-width=".8"/>');
    const dx=(R()-.5)*80, dy=g-y-r+R()*8;
    ps.push(A(c,[{transform:'translate(0px,0px)'},{transform:'translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px)'}],650+R()*450,{ease:'cubic-bezier(.45,0,1,1)',delay:R()*180}));
  }

}

}

  words:[['turn over'],['tap'],['lift'],['slowly'],['fast'],['tower']],
  opts:[
   {en:'Turn it over and lift it fast',ok:false,icon:()=>ICON.flip('fast'),run:s4fast,fb:'Too fast! The tower breaks.'},
   {en:'Turn it over and go away',ok:false,icon:()=>ICON.flip('stay'),run:s4stay,fb:'The sand is still in the bucket. You need to lift the bucket!'},
   {en:'Turn it over, tap it, lift it slowly',ok:true,icon:()=>ICON.flip('slow'),run:s4right,fb:'Look! A tall, strong tower!'}]},
 {title:'Add more towers',q:'How do you add more towers?',cam:'close',shuffle:true,
  words:[['big'],['small'],['on top'],['next to'],['heavy'],['wall']],
  opts:[
   {en:'Put a big tower on a small tower',ok:false,icon:()=>ICON.stack('big'),run:s5big,fb:'The big tower is too heavy. Everything falls down!'},
   {en:'Build the towers with dry sand',ok:false,icon:()=>ICON.stack('dry'),run:s5dry,fb:'Dry sand can\'t hold the towers. They fall apart.'},
   {en:'A small tower on top, two towers next to it',ok:true,icon:()=>ICON.stack('right'),run:s5right,fb:'Beautiful! Big at the bottom, small on top.'}]},
 {title:'Dig a moat',q:'How do you keep the castle safe from the water?',cam:'wide',shuffle:true,
  words:[['moat'],['dig'],['safe'],['tide'],['flag'],['shell']],
  opts:[
   {en:'Don\'t dig a moat',ok:false,icon:()=>ICON.moat('none'),run:s6none,fb:'The water comes to the walls. The castle breaks!'},
   {en:'Dig a moat right next to the walls',ok:false,icon:()=>ICON.moat('close'),run:s6close,fb:'The moat is too close. The walls fall into it!'},
   {en:'Dig a moat a little away from the castle',ok:true,icon:()=>ICON.moat('far'),run:s6right,fb:'Hooray! The water goes into the moat. The castle is safe!'}]}
];
const RECAP=[
 ['Choose a spot not too near and not too far from the water.'],
 ['Use wet sand.'],
 ['Fill the bucket to the top and pat the sand.'],
 ['Turn the bucket over, tap it and lift it slowly.'],
 ['Put a small tower on top and two towers next to it.'],
 ['Dig a moat around the castle.']
];

/* ---------- speech ---------- */
const canSpeak='speechSynthesis' in window; let voice=null, voiceOn=true;
function pickVoice(){ try{ const v=speechSynthesis.getVoices(); voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/Samantha|Google|Natural|Aria|Jenny|Ava/i.test(x.name))||v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }catch(e){} }
if(canSpeak){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function speak(t){ if(!canSpeak) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; if(voice) u.voice=voice; u.rate=.86; speechSynthesis.speak(u); }catch(e){} }
const autoSay=t=>{ if(voiceOn) speak(t); };
document.addEventListener('click',e=>{ const b=e.target.closest('[data-say]'); if(b){ speak(b.getAttribute('data-say')); } });
if(!canSpeak){ $('#voiceBtn').hidden=true; }

/* ---------- game flow ---------- */
const panel=$('#panel');
let cur=0, busy=false, wrongs=0, pre={}, post=null;
const clone=o=>JSON.parse(JSON.stringify(o));
const done=[], first=[];
const esc=s=>s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const sayBtn=(t,label)=>canSpeak?'<button class="say" type="button" data-say="'+esc(t)+'" aria-label="'+(label||'Listen')+'">'+SPK+'</button>':'';

function hud(){
  $('#dots').innerHTML=STEPS.map((s,i)=>'<li class="'+(done[i]?'done':(i===cur?'now':''))+'" title="'+esc(s.title)+'" aria-label="Step '+(i+1)+(done[i]?', done':'')+'">'+(done[i]?'✓':(i+1))+'</li>').join('');
  $('#starN').textContent=first.filter(Boolean).length;
}
function renderWords(list){
  $('#chips').innerHTML=list.map(w=>'<button class="chip" type="button" data-say="'+esc(w[0])+'"><span class="dotspk">'+SPK+'</span>'+esc(w[0])+'</button>').join('');
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } if(a[a.length-1].ok&&R()<.5){ [a[0],a[a.length-1]]=[a[a.length-1],a[0]]; } return a; }

function goStep(i,instant){
  cur=i; wrongs=0; const s=STEPS[i];
  if(i>=4) st.pile=false;
  pre=clone(st); post=null;
  WAVE.getAnimations().forEach(a=>a.cancel());
  Lfx.innerHTML=''; renderCastle(); if(s.setup) s.setup();
  Lspots.style.display=i===0?'':'none';
  if(i===0){ ['A','B','C'].forEach(l=>pin(l,'')); }
  cap();
  camera(CAM[s.cam],instant?0:1100);
  const opts=s.shuffle?shuffle(s.opts):s.opts;
  panel.innerHTML='<div class="eyebrow">Step '+(i+1)+' of 6</div>'+
    '<div><h2>'+esc(s.title)+'</h2></div>'+
    '<div class="q">'+sayBtn(s.q,'Listen to the question')+'<div><p>'+esc(s.q)+'</p></div></div>'+
    '<div class="opts" id="opts"></div>'+
    '<div class="fb" id="fb" hidden></div>'+
    '<button class="next" id="next" type="button" hidden>'+(i<5?'Next step →':'See my sandcastle →')+'</button>'+
    '<p class="hint" id="hint">Choose A, B or C. Then watch what happens.</p>';
  const box=$('#opts');
  opts.forEach((o,k)=>{
    const b=document.createElement('button'); b.type='button'; b.className='opt';
    const L=o.pin||'ABC'[k];
    b.innerHTML='<span class="letter">'+L+'</span><span class="ico">'+o.icon()+'</span><span class="otext"><b>'+esc(o.en)+'</b></span>';
    b.addEventListener('click',()=>choose(o,b));
    box.appendChild(b);
  });
  $('#next').addEventListener('click',()=>{ if(busy) return; if(post) Object.assign(st,post); if(cur<5){ goStep(cur+1); autoSay(STEPS[cur].q); } else finale(); });
  renderWords(s.words); hud();
}

async function choose(o,btn){
  if(busy||btn.disabled) return; busy=true;
  const s=STEPS[cur], box=$('#opts'), all=[...box.querySelectorAll('.opt')], replay=!!done[cur];
  all.forEach(b=>b.disabled=true); btn.classList.add('playing');
  const nx=$('#next'); nx.disabled=true;
  const fb=$('#fb'); fb.hidden=true; $('#hint').hidden=true;
  if(canSpeak) try{speechSynthesis.cancel();}catch(e){}
  WAVE.getAnimations().forEach(a=>a.cancel());
  Object.assign(st,clone(pre));
  Lfx.innerHTML=''; renderCastle(); if(s.setup) s.setup();
  if(cur===0) ['A','B','C'].forEach(l=>{ const p=$('#pin'+l); if(p&&p.classList.contains('play')) pin(l,''); });
  if(innerWidth<=880 && matchMedia('(orientation: portrait)').matches){ const r=$('.stage').getBoundingClientRect(); if(r.top<-10) window.scrollTo({top:scrollY+r.top-8,behavior:RM?'auto':'smooth'}); }
  try{ await o.run(); }catch(e){ console.error(e); }
  btn.classList.remove('playing');
  if(cur===0&&o.pin) pin(o.pin,o.ok?'good':'bad');
  stamp(o.ok);
  fb.className='fb '+(o.ok?'good':'bad');
  fb.innerHTML='<span class="mark">'+(o.ok?CHECK:CROSS)+'</span><div class="grow"><p>'+esc(o.fb)+'</p></div>'+sayBtn(o.fb);
  fb.hidden=false;
  if(o.ok){
    btn.classList.add('right');
    if(!replay){ done[cur]=true; first[cur]=wrongs===0; hud(); }
    post=clone(st);
    nx.hidden=false;
  }else{
    if(!replay) wrongs++;
    btn.classList.add('wrong');
  }
  const h=$('#hint');
  if(done[cur]){ all.forEach(b=>b.disabled=false); h.textContent='Tap any answer to watch it again.'; }
  else { all.forEach(b=>{ if(!b.classList.contains('wrong')) b.disabled=false; }); h.textContent='Try another answer.'; }
  h.hidden=false; nx.disabled=false;
  autoSay(o.fb);
  busy=false;
  requestAnimationFrame(()=>{ const t=o.ok?nx:fb; const r=t.getBoundingClientRect(); if(r.bottom>innerHeight) t.scrollIntoView({block:'end',behavior:RM?'auto':'smooth'}); });
}

function finale(){
  WAVE.getAnimations().forEach(a=>a.cancel()); Lfx.innerHTML=''; renderCastle();
  cur=6; hud(); cap('Your sandcastle is ready!');
  camera(CAM.final,1200); confetti(); sparkle(CX,GY-100,14,130);
  const n=first.filter(Boolean).length;
  panel.innerHTML='<div class="eyebrow">You did it!</div>'+
   '<div><h2>Your sandcastle is ready!</h2></div>'+
   '<p class="score">You got <b>'+n+' of 6</b> right on the first try.</p>'+
   '<div class="recap"><div class="label">How to make a sandcastle</div><ol>'+
   RECAP.map(r=>'<li><span class="t">'+esc(r[0])+'</span>'+sayBtn(r[0])+'</li>').join('')+'</ol></div>'+
   (canSpeak?'<button class="next" id="readAll" type="button" style="background:var(--ink);box-shadow:0 6px 0 #0A1730">Listen to all steps</button>':'')+
   '<button class="next" id="again" type="button">Play again</button>';
  const all=STEPS.reduce((a,s)=>a.concat(s.words),[]);
  renderWords(all);
  const ra=$('#readAll'); if(ra) ra.addEventListener('click',()=>speak('How to make a sandcastle. '+RECAP.map((r,i)=>'Step '+(i+1)+'. '+r[0]).join(' ')));
  $('#again').addEventListener('click',restart);
  autoSay('Your sandcastle is ready!');
  panel.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
}
function restart(){ resetState(); done.length=0; first.length=0; goStep(0); window.scrollTo({top:0,behavior:RM?'auto':'smooth'}); }

/* toggles */
$('#voiceBtn').addEventListener('click',e=>{ voiceOn=!voiceOn; e.currentTarget.setAttribute('aria-pressed',voiceOn); e.currentTarget.textContent=voiceOn?'Voice on':'Voice off'; if(!voiceOn&&canSpeak) try{speechSynthesis.cancel();}catch(_){} });

resetState(); goStep(0,true);
})();
</script>

</body></html>
